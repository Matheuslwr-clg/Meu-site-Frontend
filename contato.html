<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato | Política sem Gravata</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topo">
        <span class="logo">Política sem Gravata</span>
        <nav class="menu" aria-label="Navegação principal">
            <a href="index.html">Início</a>
            <a href="sobre.html">Sobre</a>
            <a href="contato.html" class="ativo" aria-current="page">Contato</a>
        </nav>
    </header>

    <main>
        <section class="conteudo">
            <h1>Mande uma pauta</h1>
            <p>Tem uma ideia para o site ou um assunto político que merece uma conversa? Escreva aqui.</p>
            <form action="#" class="form">
                <div class="campo">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome" placeholder="Seu nome" autocomplete="name" required>
                </div>
                <div class="campo">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="voce@exemplo.com" autocomplete="email" required>
                </div>
                <div class="campo">
                    <label for="mensagem">Mensagem</label>
                    <textarea id="mensagem" name="mensagem" rows="5" placeholder="Escreva sua mensagem" required></textarea>
                </div>
                <button type="submit" class="botao">Enviar</button>
            </form>
        </section>
    </main>
    <footer class="rodape">
        <p>Feito por Matheus - Projeto Front-End</p>
    </footer>
</body>
</html>
